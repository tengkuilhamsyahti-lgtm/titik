<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 150 64" width="150" height="64" role="img" aria-label="Titik" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="tg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="100%" stop-color="#818CF8"/>
    </linearGradient>
  </defs>

  <!-- Marka: pin monoline dengan titik di tengah dan riak sinyal -->
  <g transform="translate(8 8)" fill="none" stroke="url(#tg)"
     stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M24 5 C17.4 5 12 10.4 12 17 c0 8.5 12 18 12 18 s12-9.5 12-18 c0-6.6-5.4-12-12-12 z"/>
    <path d="M15.5 38.5 Q24 42.8 32.5 38.5" stroke-width="2.6" opacity="0.7"/>
    <path d="M9.5 41.5 Q24 47.5 38.5 41.5" stroke-width="2.4" opacity="0.35"/>
  </g>
  <circle cx="32" cy="25" r="4.4" fill="url(#tg)"/>

  <!-- Wordmark. Titik penutup dibuat sebagai tspan supaya selalu duduk
       rapat di baseline, berapa pun metrik font yang tersedia. -->
  <text x="62" y="41"
        font-family="'Inter','Segoe UI',system-ui,-apple-system,sans-serif"
        font-size="30" font-weight="650" letter-spacing="-0.8"
        fill="#E8EDFB">titik<tspan fill="url(#tg)">.</tspan></text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
